<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f131b" media="(prefers-color-scheme: dark)">
<meta name="description" content="To-do รายวัน แตกงานย่อยได้">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Daily List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* reset พื้นฐาน (เดิม Artifact ใส่ให้ ตอนนี้ต้องใส่เอง) */
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }

/* Layout: คอลัมน์เดียวแบบมือถือ — หัววันที่ด้านบน, การ์ดงานตรงกลาง, ช่องพิมพ์งานติดขอบล่างให้นิ้วโป้งเอื้อมถึง */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --ink: #172033;
  --muted: #5d6880;
  --line: #d8deea;
  --accent: #2b54e0;
  --accent-soft: #e2e8fc;
  --done: #178a5c;
  --danger: #c4372c;
  --font-display: "Anuphan", "Leelawadee UI", "Noto Sans Thai", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Thai", "Leelawadee UI", "Noto Sans Thai", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131b; --surface: #181f2c; --ink: #e5e9f2; --muted: #8f99ad; --line: #2a3346;
    --accent: #7d9bff; --accent-soft: #1f2a48; --done: #3fbf8a; --danger: #ff7a6e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131b; --surface: #181f2c; --ink: #e5e9f2; --muted: #8f99ad; --line: #2a3346;
  --accent: #7d9bff; --accent-soft: #1f2a48; --done: #3fbf8a; --danger: #ff7a6e; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.app {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 140px;
  display: flex; flex-direction: column; gap: 16px;
}

/* ---------- หัวข้อ ---------- */
.top { display: flex; flex-direction: column; gap: 6px; }
.date { margin: 0; color: var(--muted); font-size: 14px; letter-spacing: .01em; }
.top h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 1.15; text-wrap: balance; }
.summary { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.summary strong { color: var(--ink); font-weight: 600; }
.meter { flex: 1; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--done); border-radius: inherit; transition: width .25s ease; }

/* ---------- แท็บ ---------- */
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--line); border-radius: 12px; }
.tabs button { border: 0; background: transparent; padding: 9px 8px; border-radius: 9px; font-weight: 500; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.tabs small { font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--accent); margin-left: 4px; }

/* ---------- แบนเนอร์ตัวอย่าง ---------- */
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 14px; background: var(--accent-soft); border-radius: 12px; font-size: 14px; }
.banner p { margin: 0; flex: 1 1 200px; min-width: 0; }
.banner .actions { display: flex; gap: 8px; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 9px; font-size: 14px; font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #0f131b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0f131b; } }
.btn:disabled { opacity: .45; cursor: default; }

/* ---------- รายการงาน ---------- */
.list, .children { list-style: none; margin: 0; padding: 0; }
.list { display: flex; flex-direction: column; gap: 8px; }
.list > .task { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 2px 4px; }
.children { margin: 0 0 6px 19px; padding-left: 7px; border-left: 2px solid var(--line); }

.row { display: flex; align-items: center; gap: 2px; min-height: 48px; }
.check { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: none; padding: 0; }
.box { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; transition: background .15s, border-color .15s; }
.box svg { width: 14px; height: 14px; opacity: 0; }
.task.done > .row .box { background: var(--done); border-color: var(--done); }
.task.done > .row .box svg { opacity: 1; }
.task.partial > .row .box { border-color: var(--done); }

.title { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 10px 4px; overflow-wrap: anywhere; }
.list > .task > .row .title { font-weight: 500; }
.task.done > .row .title { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.edit { flex: 1; min-width: 0; padding: 8px 10px; border: 1.5px solid var(--accent); border-radius: 8px; background: var(--surface); }

.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--bg); border-radius: 99px; padding: 4px 8px 4px 10px; font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip .bar { width: 26px; height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; }
.chip .bar i { display: block; height: 100%; background: var(--done); }
.chip svg { width: 12px; height: 12px; transition: transform .2s; }
.task.closed > .row .chip svg { transform: rotate(-90deg); }

.icon { flex: none; width: 36px; height: 36px; display: grid; place-items: center; border: 0; background: none; border-radius: 8px; color: var(--muted); padding: 0; }
.icon svg { width: 18px; height: 18px; }
.icon:hover { background: var(--bg); color: var(--ink); }
.icon.del:hover { color: var(--danger); }

.subadd { display: flex; gap: 6px; padding: 0 6px 10px 42px; }
.subadd input { flex: 1; min-width: 0; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); }
.subadd input:focus { border-color: var(--accent); outline: none; }

.empty { text-align: center; padding: 36px 16px; color: var(--muted); border: 1.5px dashed var(--line); border-radius: 14px; }
.empty h2 { margin: 0 0 6px; font-family: var(--font-display); font-size: 20px; color: var(--ink); }
.empty p { margin: 0; font-size: 14px; }

.tools { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); }

/* ---------- ช่องพิมพ์ด้านล่าง ---------- */
.composer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--bg); border-top: 1px solid var(--line);
  padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.composer form { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }
.composer input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); }
.composer input:focus { border-color: var(--accent); outline: none; }
.composer button { border: 0; border-radius: 12px; padding: 0 18px; background: var(--accent); color: #fff; font-weight: 600; }
:root[data-theme="dark"] .composer button { color: #0f131b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .composer button { color: #0f131b; } }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 6;
  bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 14px; max-width: calc(100% - 32px);
  padding: 10px 10px 10px 16px; border-radius: 12px; background: var(--ink); color: var(--bg); font-size: 14px;
  box-shadow: 0 6px 20px rgba(0,0,0,.25);
}
.toast button { border: 0; background: none; color: var(--accent-soft); font-weight: 600; padding: 6px 8px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <p class="date" id="today"></p>
    <h1>สิ่งที่ต้องทำวันนี้</h1>
    <div class="summary"><span id="count"></span><div class="meter" aria-hidden="true"><i id="meter"></i></div></div>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-daily" aria-selected="true" data-tab="daily">Daily</button>
    <button role="tab" id="tab-long" aria-selected="false" data-tab="long">Long Term<small>v2</small></button>
  </div>

  <section id="panel-daily">
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="banner" id="banner" hidden>
        <p>นี่คือรายการตัวอย่าง ลองติ๊ก ขีดฆ่า หรือกด + เพื่อแตกงานย่อยดูได้เลย</p>
        <div class="actions">
          <button class="btn" id="keepSample">เก็บไว้</button>
          <button class="btn primary" id="clearSample">เริ่มลิสต์ของฉัน</button>
        </div>
      </div>
      <ul class="list" id="list"></ul>
      <div class="tools" id="tools">
        <label class="switch"><input type="checkbox" id="hideDone"> ซ่อนงานที่เสร็จแล้ว</label>
        <button class="btn" id="clearDone">ล้างงานที่เสร็จ</button>
      </div>
    </div>
  </section>

  <section id="panel-long" hidden>
    <div class="empty">
      <h2>Long Term จะมาใน v2</h2>
      <p>งานที่มีวันเริ่ม–วันสิ้นสุด แตกเป็นขั้นตอนย่อยพร้อมวันกำหนด และเตือนเมื่อใกล้ถึงเส้นตาย</p>
    </div>
  </section>
</div>

<div class="composer">
  <form id="addForm" autocomplete="off">
    <input id="newTask" placeholder="เพิ่มงานใหม่…" maxlength="140" aria-label="เพิ่มงานใหม่">
    <button type="submit">เพิ่ม</button>
  </form>
</div>

<div class="toast" id="toast" role="status" hidden><span id="toastText"></span><button id="undoBtn">เลิกทำ</button></div>

<script>
/* =========================================================
   1) ข้อมูล (Data model)
   งาน 1 ชิ้น = { id, title, done, open, children: [งานย่อย…] }
   children เก็บงานแบบเดียวกันซ้อนลงไปได้เรื่อยๆ (โครงสร้างแบบต้นไม้)
   ========================================================= */
const KEY = 'daily-todo-v1';
const MAX_DEPTH = 3;               // ซ้อนได้ 4 ชั้น (0-3) พอดีจอมือถือ
const ui = { editingId: null, addingTo: null, focus: null, tab: 'daily' };
let undoSnapshot = null, toastTimer = null;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const makeTask = (title, done = false, children = []) => ({ id: uid(), title, done, open: true, children });

function seed() {
  return {
    isSample: true, hideDone: false,
    tasks: [
      makeTask('เตรียมเอกสาร Hydrotest', false, [
        makeTask('เช็ค Drawing rev ล่าสุด', true),
        makeTask('คำนวณ Test pressure', false, [
          makeTask('ดู MAWP จาก Nameplate', true),
          makeTask('คูณ 1.3 ตาม ASME VIII-1 UG-99'),
        ]),
        makeTask('พิมพ์ฟอร์มบันทึกผล'),
      ]),
      makeTask('ซื้อของเข้าบ้าน', false, [makeTask('นม', true), makeTask('ไข่'), makeTask('กาแฟ')]),
      makeTask('ออกกำลังกาย 30 นาที'),
      makeTask('จ่ายค่าไฟ', true),
    ],
  };
}

/* =========================================================
   2) บันทึก/โหลด (Storage) — เก็บไว้ในเครื่องด้วย localStorage
   ========================================================= */
function load() { try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* บางโหมดเก็บไม่ได้ ใช้ต่อในหน่วยความจำ */ } }
let state = load() || seed();

/* =========================================================
   3) ฟังก์ชันจัดการงาน (Actions)
   ========================================================= */
// ค้นหางานจาก id ในทุกชั้น (recursive)
function find(id, list = state.tasks, parent = null, depth = 0) {
  for (let i = 0; i < list.length; i++) {
    const t = list[i];
    if (t.id === id) return { task: t, list, index: i, parent, depth };
    const r = find(id, t.children, t, depth + 1);
    if (r) return r;
  }
  return null;
}
// ติ๊กงานแม่ = ติ๊กงานลูกทั้งหมด
function setDoneDeep(t, v) { t.done = v; t.children.forEach(c => setDoneDeep(c, v)); }
// งานแม่จะ "เสร็จ" ก็ต่อเมื่องานลูกเสร็จครบทุกข้อ
function syncParents(list = state.tasks) {
  list.forEach(t => { if (t.children.length) { syncParents(t.children); t.done = t.children.every(c => c.done); } });
}
function commit() { syncParents(); save(); render(); }

function addTask(title, parentId = null) {
  title = title.trim(); if (!title) return;
  if (parentId) { const r = find(parentId); r.task.children.push(makeTask(title)); r.task.open = true; }
  else state.tasks.push(makeTask(title));
  commit();
}
function toggleTask(id) { const { task } = find(id); setDoneDeep(task, !task.done); commit(); }
function renameTask(id, title) { const r = find(id); if (r && title.trim()) r.task.title = title.trim(); ui.editingId = null; commit(); }
function deleteTask(id) {
  snapshot();
  const r = find(id); r.list.splice(r.index, 1);
  commit(); showToast(`ลบ “${r.task.title}” แล้ว`);
}
function clearDone() {
  snapshot();
  const prune = list => list.filter(t => !t.done).map(t => (t.children = prune(t.children), t));
  state.tasks = prune(state.tasks);
  commit(); showToast('ล้างงานที่เสร็จแล้ว');
}
// เก็บสำเนาไว้สำหรับปุ่ม "เลิกทำ" (แทน confirm ที่ถามก่อนลบ)
function snapshot() { undoSnapshot = JSON.stringify(state.tasks); }
function undo() { if (undoSnapshot) { state.tasks = JSON.parse(undoSnapshot); undoSnapshot = null; commit(); } hideToast(); }

/* =========================================================
   4) แสดงผล (Render) — สร้าง HTML ใหม่ทุกครั้งที่ข้อมูลเปลี่ยน
   ========================================================= */
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ICON = {
  check: '<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>',
  plus: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg>',
  trash: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12M8 6V4h4v2M6 6l1 10h6l1-10"/></svg>',
  chev: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5l3 3 3-3"/></svg>',
  close: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg>',
};

function taskHTML(t, depth) {
  if (state.hideDone && t.done) return '';
  const n = t.children.length, d = t.children.filter(c => c.done).length;
  const cls = ['task', t.done && 'done', !t.done && d > 0 && 'partial', n && !t.open && 'closed'].filter(Boolean).join(' ');
  const title = ui.editingId === t.id
    ? `<input class="edit" id="edit-${t.id}" data-edit="${t.id}" value="${esc(t.title)}" maxlength="140" aria-label="แก้ไขชื่องาน">`
    : `<button class="title" data-action="edit" title="แตะเพื่อแก้ไข">${esc(t.title)}</button>`;
  const chip = n ? `<button class="chip" data-action="fold" aria-expanded="${t.open}" aria-label="งานย่อยเสร็จ ${d} จาก ${n}">
      <span class="bar"><i style="width:${Math.round(d / n * 100)}%"></i></span>${d}/${n}${ICON.chev}</button>` : '';
  const addBtn = depth < MAX_DEPTH ? `<button class="icon" data-action="add-sub" aria-label="เพิ่มงานย่อย">${ICON.plus}</button>` : '';
  const subForm = ui.addingTo === t.id ? `<form class="subadd" data-parent="${t.id}" autocomplete="off">
      <input id="sub-${t.id}" placeholder="งานย่อยของ “${esc(t.title)}”" maxlength="140" aria-label="เพิ่มงานย่อย">
      <button class="btn primary" type="submit">เพิ่ม</button>
      <button class="icon" type="button" data-action="close-sub" aria-label="ปิด">${ICON.close}</button></form>` : '';
  const kids = n && t.open ? `<ul class="children">${t.children.map(c => taskHTML(c, depth + 1)).join('')}</ul>` : '';
  return `<li class="${cls}" data-id="${t.id}">
    <div class="row">
      <button class="check" data-action="toggle" role="checkbox" aria-checked="${t.done}" aria-label="ทำเสร็จ"><span class="box">${ICON.check}</span></button>
      ${title}${chip}${addBtn}
      <button class="icon del" data-action="delete" aria-label="ลบงาน">${ICON.trash}</button>
    </div>${subForm}${kids}</li>`;
}

function render() {
  const total = state.tasks.length, done = state.tasks.filter(t => t.done).length;
  $('count').innerHTML = total ? `เหลือ <strong>${total - done}</strong> งาน · เสร็จ ${done}/${total}` : 'ยังไม่มีงาน';
  $('meter').style.width = total ? (done / total * 100) + '%' : '0';
  $('banner').hidden = !state.isSample;
  $('hideDone').checked = state.hideDone;
  $('clearDone').disabled = !JSON.stringify(state.tasks).includes('"done":true');
  $('tools').hidden = total === 0;

  const html = state.tasks.map(t => taskHTML(t, 0)).join('');
  $('list').innerHTML = html || (total
    ? '<li class="empty"><h2>เสร็จหมดแล้ว</h2><p>งานที่เสร็จถูกซ่อนไว้ ปิดสวิตช์ด้านล่างเพื่อดูอีกครั้ง</p></li>'
    : '<li class="empty"><h2>ยังไม่มีงานวันนี้</h2><p>พิมพ์ในช่องด้านล่างแล้วกด เพิ่ม เพื่อสร้างงานแรก</p></li>');

  if (ui.focus) { const el = $(ui.focus); if (el) { el.focus(); if (el.select && ui.focus.startsWith('edit')) el.select(); } ui.focus = null; }
}

/* =========================================================
   5) รับคำสั่งจากผู้ใช้ (Events) — ฟังที่ตัวลิสต์ที่เดียว (event delegation)
   ========================================================= */
$('list').addEventListener('click', e => {
  const btn = e.target.closest('[data-action]'); if (!btn) return;
  const id = btn.closest('.task').dataset.id;
  switch (btn.dataset.action) {
    case 'toggle': toggleTask(id); break;
    case 'delete': deleteTask(id); break;
    case 'fold': { const { task } = find(id); task.open = !task.open; commit(); break; }
    case 'edit': ui.editingId = id; ui.focus = 'edit-' + id; render(); break;
    case 'add-sub': ui.addingTo = id; ui.focus = 'sub-' + id; render(); break;
    case 'close-sub': ui.addingTo = null; render(); break;
  }
});
$('list').addEventListener('submit', e => {
  e.preventDefault();
  const form = e.target, parentId = form.dataset.parent, input = form.querySelector('input');
  ui.focus = 'sub-' + parentId;            // พิมพ์งานย่อยต่อได้ทันที
  addTask(input.value, parentId);
});
$('list').addEventListener('keydown', e => {
  if (e.target.dataset.edit) {
    if (e.key === 'Enter') e.target.blur();
    if (e.key === 'Escape') { ui.editingId = null; render(); }
  }
  if (e.key === 'Escape' && e.target.closest('.subadd')) { ui.addingTo = null; render(); }
});
$('list').addEventListener('focusout', e => {
  if (e.target.dataset.edit && ui.editingId) renameTask(e.target.dataset.edit, e.target.value);
});

$('addForm').addEventListener('submit', e => {
  e.preventDefault(); addTask($('newTask').value); $('newTask').value = ''; $('newTask').focus();
});
$('hideDone').addEventListener('change', e => { state.hideDone = e.target.checked; commit(); });
$('clearDone').addEventListener('click', clearDone);
$('keepSample').addEventListener('click', () => { state.isSample = false; commit(); });
$('clearSample').addEventListener('click', () => { state.tasks = []; state.isSample = false; commit(); $('newTask').focus(); });
$('undoBtn').addEventListener('click', undo);

document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  ui.tab = b.dataset.tab;
  document.querySelectorAll('[data-tab]').forEach(x => x.setAttribute('aria-selected', x === b));
  $('panel-daily').hidden = ui.tab !== 'daily';
  $('panel-long').hidden = ui.tab !== 'long';
  document.querySelector('.composer').hidden = ui.tab !== 'daily';
});

function showToast(text) {
  $('toastText').textContent = text; $('toast').hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 5000);
}
function hideToast() { $('toast').hidden = true; }

$('today').textContent = new Date().toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
render();
</script>

<script>
/* 6) PWA — ลงทะเบียน Service Worker เพื่อให้แอปเปิดได้แม้ไม่มีเน็ต */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
